[package]
name = "jetgraph-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Investigation MCP server for JetGraph. The host agent supplies the model."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "jetgraph-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
jetgraph-client = { path = ".." }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-std", "signal", "time"] }
tokio-util = "0.7"

[dev-dependencies]
rmcp = { version = "3.8", features = ["client", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
